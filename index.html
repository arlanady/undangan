<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wedding</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <script src="https://unpkg.com/feather-icons"></script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Imperial+Script&family=Merienda:wght@300..900&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="wrapper">
        <audio id="music" loop>
            <source src="assets/music.mp3" type="audio/mpeg">
        </audio>
        <div class="bg">
             <!-- 🌸 BUNGA JATUH -->
      <div class="falling-flowers"></div>

    <img src="assets/bunga1.webp" class="bunga kiri-atas">
    <img src="assets/bunga2.webp" class="bunga kanan-atas">
    <img src="assets/bunga3.webp" class="bunga kiri-bawah">
    <img src="assets/bunga4.webp" class="bunga kanan-bawah">

    <div class="overlay">
        <h1 class="judul">The Wedding</h1>

        <h2 class="nama">Makrus & Mila</h2>

        <div class="card-tamu">
        <p class="kepada">Kepada Yth:</p>
        <h3 class="nama-tamu">Saudara/i</h3>
        </div>

        <button class="btn-buka" onclick="bukaUndangan()">
            Buka Undangan
        </button>
        

    </div>

    <div class="halaman-isi" id="isi">

  <!-- SECTION -->
  <section id="home" class="section aktif">Home</section>
  <section id="tanggal" class="section">Tanggal Acara</section>
  <section id="gallery" class="section">Gallery</section>
  <section id="rsvp" class="section">RSVP</section>
  <section id="maps" class="section">Maps</section>
  <section id="gift" class="section">Gift</section>
  <section id="mempelai" class="section">Mempelai</section>

</div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar" style="display: none;">

    <button onclick="showSection('home')">
    <i data-feather="home"></i>
    </button>
    <button onclick="showSection('tanggal')">
    <i data-feather="calendar"></i>
    </button>
    <button onclick="showSection('gallery')">
    <i data-feather="image"></i>
    </button>

    <button onclick="showSection('rsvp')">
        <i data-feather="edit"></i>
    </button>

    <button onclick="showSection('maps')">
        <i data-feather="map-pin"></i>
    </button>

    <button onclick="showSection('gift')">
        <i data-feather="gift"></i>
    </button>

    <button onclick="showSection('mempelai')">
        <i data-feather="users"></i>
    </button>

    </div>

    </div>
    <button onclick="toggleMusic()" class="btn-music">
    🔊
    </button>
    </div>
    
</body>
<script>
      feather.replace();
    </script>
<script src="script.js"></script>
</html>
